# omnetpp.ini
# ═══════════════════════════════════════════════════════════════════════
# Multi-Layer IDS Simulation — All Experiment Configurations
#
# Run experiments via:
#   opp_run -c <ConfigName> -r 0 network.ned
#
# Or batch all:
#   for cfg in NoIDS CloudOnly MultiLayer Adaptive LatencyAware Distillation; do
#     opp_run -c $cfg -r 0..2 network.ned
#   done
# ═══════════════════════════════════════════════════════════════════════

[General]
network             = MultiLayerIDSNetwork
sim-time-limit      = 300s            # 5 minutes simulated time
warmup-period       = 10s             # Discard first 10s (startup transients)
repeat              = 3               # 3 runs per config (different seeds)
seed-set            = ${repetition}

# ── Output files ─────────────────────────────────────────────────────
output-vector-file  = results/${configname}-run${runnumber}.vec
output-scalar-file  = results/${configname}-run${runnumber}.sca
eventlog-file       = results/${configname}-run${runnumber}.elog

# ── Recording modes ───────────────────────────────────────────────────
**.result-recording-modes          = all
**.throughput.result-recording-modes     = vector,stats
**.latency.result-recording-modes        = vector,histogram
**.packetLoss.result-recording-modes     = scalar,vector
**.alert*.result-recording-modes         = count,vector
**.trueP*.result-recording-modes         = count
**.falseP*.result-recording-modes        = count
**.falseN*.result-recording-modes        = count

# ── Default node parameters (shared across all configs) ───────────────
**.mist[*].generationInterval      = 0.1s
**.mist[*].windowSize              = 100
**.mist[*].anomalyZThreshold       = 3.0
**.mist[*].cpuOverloadThresh       = 0.80
**.mist[*].cpuLoadDecayFactor      = 0.95

**.edge[*].drainInterval           = 0.01s
**.edge[*].detectionMode           = "hybrid"
**.edge[*].failureProbability      = 0.001

**.fog[*].correlationWindow        = 0.5s
**.fog[*].correlationThreshold     = 3
**.fog[*].mlInferenceDelay         = 5ms

**.cloud.deepLearningDelay         = 50ms
**.cloud.policyUpdateInterval      = 30s

# ─────────────────────────────────────────────────────────────────────
# Config 1: Baseline — NO IDS at any layer
# Use this to measure raw network performance (throughput, latency)
# without any detection overhead.
# ─────────────────────────────────────────────────────────────────────
[Config NoIDS]
description = "Baseline: no IDS, 20% attack traffic"
**.idsEnabled               = false
**.adaptiveOffload          = false
**.latencyAwareRouting      = false
**.enableDistillation       = false
**.mist[*].attackRatio      = 0.20
**.mist[*].useTrace         = true

# ─────────────────────────────────────────────────────────────────────
# Config 2: Single-layer — Cloud IDS only
# Edge/fog/mist pass all traffic through; only cloud classifies.
# Worst-case latency, highest accuracy.
# ─────────────────────────────────────────────────────────────────────
[Config CloudOnly]
description = "Single-layer: IDS at cloud only"
**.mist[*].idsEnabled       = false
**.edge[*].idsEnabled       = false
**.fog[*].idsEnabled        = false
**.cloud.idsEnabled         = true
**.mist[*].attackRatio      = 0.20
**.mist[*].useTrace         = true

# ─────────────────────────────────────────────────────────────────────
# Config 3: Full Multi-Layer IDS (baseline for our system)
# All layers active: mist Z-score, edge hybrid, fog correlation, cloud DL.
# ─────────────────────────────────────────────────────────────────────
[Config MultiLayer]
description = "Full multi-layer IDS — all layers active"
**.idsEnabled               = true
**.adaptiveOffload          = false
**.latencyAwareRouting      = false
**.enableDistillation       = false
**.mist[*].attackRatio      = 0.20
**.mist[*].useTrace         = true

# Vary attack ratio to test robustness
[Config MultiLayer_HighAttack]
extends = MultiLayer
description = "Multi-layer IDS — high attack ratio (50%)"
**.mist[*].attackRatio      = 0.50

[Config MultiLayer_LowAttack]
extends = MultiLayer
description = "Multi-layer IDS — low attack ratio (5%)"
**.mist[*].attackRatio      = 0.05

# ─────────────────────────────────────────────────────────────────────
# Config 4: Contribution 1 — Adaptive IDS offloading
# Mist offloads to edge when CPU > 80%; edge compensates.
# Compare vs. MultiLayer: energy vs. false negatives trade-off.
# ─────────────────────────────────────────────────────────────────────
[Config Adaptive]
description = "Contribution 1: Adaptive mist offloading"
**.idsEnabled               = true
**.adaptiveOffload          = true
**.latencyAwareRouting      = false
**.enableDistillation       = false
**.mist[*].attackRatio      = 0.20
**.mist[*].cpuOverloadThresh = 0.80

# Test different offload thresholds
[Config Adaptive_Thresh60]
extends = Adaptive
description = "Adaptive offload at 60% CPU threshold"
**.mist[*].cpuOverloadThresh = 0.60

[Config Adaptive_Thresh90]
extends = Adaptive
description = "Adaptive offload at 90% CPU threshold"
**.mist[*].cpuOverloadThresh = 0.90

# ─────────────────────────────────────────────────────────────────────
# Config 5: Contribution 2 — Latency-aware detection routing
# Edge drops non-alert packets exceeding the real-time deadline.
# Compare vs. MultiLayer: latency CDF and packet loss.
# ─────────────────────────────────────────────────────────────────────
[Config LatencyAware]
description = "Contribution 2: Latency-aware routing"
**.idsEnabled               = true
**.adaptiveOffload          = false
**.latencyAwareRouting      = true
**.enableDistillation       = false
**.edge[*].realtimeDeadlineMs = 5.0
**.mist[*].attackRatio      = 0.20

[Config LatencyAware_10ms]
extends = LatencyAware
description = "Latency-aware routing — 10ms deadline"
**.edge[*].realtimeDeadlineMs = 10.0

[Config LatencyAware_2ms]
extends = LatencyAware
description = "Latency-aware routing — 2ms deadline (aggressive)"
**.edge[*].realtimeDeadlineMs = 2.0

# ─────────────────────────────────────────────────────────────────────
# Config 6: Contribution 3 — Federated knowledge distillation
# Cloud pushes compressed model to fog every 30s.
# Measure: fog detection accuracy improvement over simulation time.
# ─────────────────────────────────────────────────────────────────────
[Config Distillation]
description = "Contribution 3: Knowledge distillation cloud→fog"
**.idsEnabled               = true
**.adaptiveOffload          = false
**.latencyAwareRouting      = false
**.enableDistillation       = true
**.fog[*].distillationInterval = 30s
**.cloud.policyUpdateInterval  = 30s
**.mist[*].attackRatio      = 0.20

# ─────────────────────────────────────────────────────────────────────
# Config 7: Combined (all three contributions active)
# Best-case system: compare vs. NoIDS and MultiLayer.
# ─────────────────────────────────────────────────────────────────────
[Config Combined]
description = "All contributions: adaptive + latency-aware + distillation"
**.idsEnabled               = true
**.adaptiveOffload          = true
**.latencyAwareRouting      = true
**.enableDistillation       = true
**.mist[*].cpuOverloadThresh    = 0.80
**.edge[*].realtimeDeadlineMs   = 5.0
**.fog[*].distillationInterval  = 30s
**.cloud.policyUpdateInterval   = 30s
**.mist[*].attackRatio          = 0.20

# ─────────────────────────────────────────────────────────────────────
# Config 8: Edge detection mode comparison
# Vary detectionMode to compare: "rules" vs "ml" vs "hybrid"
# ─────────────────────────────────────────────────────────────────────
[Config EdgeRulesOnly]
extends = MultiLayer
description = "Edge: rule-based only (Snort-style)"
**.edge[*].detectionMode    = "rules"

[Config EdgeMLOnly]
extends = MultiLayer
description = "Edge: ML lookup only (Decision Tree)"
**.edge[*].detectionMode    = "ml"

[Config EdgeHybrid]
extends = MultiLayer
description = "Edge: hybrid (rules + ML) — DEFAULT"
**.edge[*].detectionMode    = "hybrid"

# ─────────────────────────────────────────────────────────────────────
# Config 9: Scalability test — vary number of active mist nodes
# Keep everything else same as MultiLayer
# ─────────────────────────────────────────────────────────────────────
[Config Scale_10Nodes]
extends = MultiLayer
description = "Scalability: 10 active mist nodes"
**.mist[10..19].generationInterval = 999s  # Effectively silent

[Config Scale_20Nodes]
extends = MultiLayer
description = "Scalability: all 20 mist nodes (full load)"
# Default — nothing to override

# ─────────────────────────────────────────────────────────────────────
# Config 10: Synthetic (no trace) — for when dataset unavailable
# ─────────────────────────────────────────────────────────────────────
[Config Synthetic]
extends = MultiLayer
description = "Synthetic traffic (no NSL-KDD trace)"
**.mist[*].useTrace         = false
**.mist[*].attackRatio      = 0.20
